name: quelyra

services:
  agent-api:
    build:
      context: ./services/agent-api
      dockerfile: Dockerfile
    image: quelyra-agent-api:dev
    container_name: quelyra-agent-api
    environment:
      QUELYRA_POSTGRES_HOST: postgres
      QUELYRA_POSTGRES_PORT: 5432
      QUELYRA_POSTGRES_DB: ${QUELYRA_POSTGRES_DB:-quelyra}
      QUELYRA_POSTGRES_USER: ${QUELYRA_POSTGRES_USER:-quelyra}
      QUELYRA_POSTGRES_PASSWORD: ${QUELYRA_POSTGRES_PASSWORD:-quelyra_dev_password}
      QUELYRA_REDIS_HOST: redis
      QUELYRA_REDIS_PORT: 6379
    ports:
      - "${QUELYRA_AGENT_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - quelyra-network

  query-gateway:
    build:
      context: ./services/query-gateway
      dockerfile: Dockerfile
    image: quelyra-query-gateway:dev
    container_name: quelyra-query-gateway
    environment:
      QUELYRA_POSTGRES_HOST: postgres
      QUELYRA_POSTGRES_PORT: 5432
      QUELYRA_POSTGRES_DB: ${QUELYRA_POSTGRES_DB:-quelyra}
      QUELYRA_POSTGRES_USER: ${QUELYRA_POSTGRES_USER:-quelyra}
      QUELYRA_POSTGRES_PASSWORD: ${QUELYRA_POSTGRES_PASSWORD:-quelyra_dev_password}
      QUELYRA_REDIS_HOST: redis
      QUELYRA_REDIS_PORT: 6379
    ports:
      - "${QUELYRA_QUERY_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - quelyra-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: quelyra-web:dev
    container_name: quelyra-web
    environment:
      VITE_AGENT_API_BASE_URL: http://localhost:${QUELYRA_AGENT_API_PORT:-8000}
    ports:
      - "${QUELYRA_WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - quelyra-network

  postgres:
    image: postgres:16
    container_name: quelyra-postgres
    environment:
      POSTGRES_DB: ${QUELYRA_POSTGRES_DB:-quelyra}
      POSTGRES_USER: ${QUELYRA_POSTGRES_USER:-quelyra}
      POSTGRES_PASSWORD: ${QUELYRA_POSTGRES_PASSWORD:-quelyra_dev_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "${QUELYRA_POSTGRES_PORT:-15432}:5432"
    volumes:
      - type: bind
        source: ${QUELYRA_DATA_ROOT:-D:/data/quelyra}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - quelyra-network

  redis:
    image: redis:7.2.5
    container_name: quelyra-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${QUELYRA_REDIS_PORT:-16379}:6379"
    volumes:
      - type: bind
        source: ${QUELYRA_DATA_ROOT:-D:/data/quelyra}/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - quelyra-network

networks:
  quelyra-network:
    name: quelyra-network
    driver: bridge
